<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Painel KOMMO – Follow-up e Agenda</title>
  <style>
    :root{
      --bg:#f4f6f3;--card:#fff;--ink:#16302c;--mut:#5f7571;--line:#dbe3df;--g:#1f7a6d;--a:#d99a1c;--b:#3d6fa8;--r:#c2455a;--k:#9aa8a4;--p:#7a5aa6;
      --shadow:0 1px 2px rgba(16,40,36,.05),0 6px 20px -10px rgba(16,40,36,.12);
      color-scheme:light;
      box-sizing:border-box;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Figtree,system-ui,sans-serif;}
    header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:18px 22px 6px;max-width:1180px;margin:auto;position:sticky;top:0;z-index:10;background:var(--bg)}
    h1{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:0}
    .note{color:var(--mut);font-size:13px}
    nav{display:flex;gap:4px;background:var(--bg);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
    nav button{border:0;background:none;color:var(--mut);font:inherit;font-weight:500;padding:7px 14px;border-radius:8px;cursor:pointer}
    nav button.on{background:var(--g);color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
    main{max-width:1180px;margin:auto;padding:12px 22px 40px}
    .hide{display:none}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-top:14px}
    .row{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-top:12px}
    .f{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
    .f label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px;font-weight:500}
    input,select,textarea,button.b{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 9px;transition:border-color .15s,box-shadow .15s,background .15s}
    input,select,textarea{background:var(--card);min-height:36px}
    input:hover,select:hover,textarea:hover{border-color:var(--k)}
    input:focus,select:focus,textarea:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 3px rgba(31,122,109,.15)}
    button.b{cursor:pointer;background:var(--g);color:#fff;border-color:var(--g);font-weight:500;padding:8px 15px;box-shadow:0 1px 2px rgba(0,0,0,.12)}
    button.b.s{background:none;color:var(--ink);border-color:var(--line);box-shadow:none}
    button.b.s:hover{background:var(--bg);filter:none;border-color:var(--k)}
    button.b:hover{filter:brightness(1.07)}
    button.x{border:0;background:none;color:var(--r);cursor:pointer;font-size:16px;border-radius:6px;padding:2px 7px}
    button.x:hover{background:rgba(194,69,90,.12)}
    .tag{padding:2px 8px;border-radius:999px;font-size:12px;background:var(--line);font-weight:500}
    .wrap{overflow-x:auto}
    table{border-collapse:collapse;width:100%;font-size:13px}
    th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
    th{color:var(--mut);font-weight:600;letter-spacing:.04em;background:var(--bg);position:sticky;top:0}
    .status-success{color:#1f7a6d;font-weight:700}
    .status-error{color:#c2455a;font-weight:700}
    @media (max-width:640px){header{padding:10px 14px}main{padding:14px 14px 32px}.card{padding:14px}}
  </style>
</head>
<body>
  <header>
    <div><h1 id="ttl">Painel KOMMO</h1><div class="note" id="st">Carregando…</div></div>
    <nav id="nav">
      <button data-t="dash" class="on">Painel</button>
      <button data-t="sem">Lançar semana</button>
      <button data-t="cons">Consultas</button>
      <button data-t="cfg">Configuração</button>
    </nav>
  </header>

  <main>
    <section id="dash" class="card">
      <h2>Resumo</h2>
      <p class="note">Os dados ficam salvos no navegador para evitar perda ao recarregar ou fechar a aba.</p>
    </section>

    <section id="sem" class="hide">
      <div class="card">
        <h2>Lançamento semanal</h2>
        <p class="note">Escolha a data da semana. Se a semana já existir, os valores são carregados para edição.</p>
        <div class="row" style="margin:0 0 12px">
          <label class="note">Data da semana<br><input type="date" id="wd"></label>
          <button class="b s" id="cp">Copiar valores da semana anterior</button>
        </div>
        <div class="f" id="wf"></div>
        <div class="row">
          <button class="b" id="ws">Salvar semana</button>
          <button class="b s" id="wdel">Excluir esta semana</button>
        </div>
      </div>

      <div class="card">
        <h2>Semanas lançadas</h2>
        <div id="wl" class="wrap"></div>
      </div>
    </section>

    <section id="cons" class="hide">
      <div class="card">
        <h2>Registrar consulta agendada</h2>
        <div class="f">
          <label>Paciente<input id="cp_n" placeholder="Nome ou iniciais"></label>
          <label>Veio de<select id="cp_o"></select></label>
          <label>Agendada em<input type="date" id="cp_s"></label>
          <label>Data da consulta<input type="date" id="cp_c"></label>
        </div>
        <div class="row"><button class="b" id="cp_add">Adicionar consulta</button></div>
      </div>

      <div class="card">
        <h2>Consultas registradas</h2>
        <div id="al"></div>
      </div>
    </section>

    <section id="cfg" class="hide"></section>
  </main>

  <div id="msg" class="note" style="position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s ease"></div>

  <script>
    const FIELDS = [
      ['novos','Novos leads'],
      ['antigas','Conversas antigas retomadas'],
      ['ativas','Total de conversas ativas'],
      ['fu2','Contatados no follow-up 2'],
      ['fu3','Contatados no follow-up 3'],
      ['fu4','Contatados no follow-up 4'],
      ['fu5','Contatados no follow-up 5'],
      ['resp','Respostas recebidas no follow-up'],
      ['agend','Agendamentos gerados pelo follow-up'],
      ['semresp','Sem resposta no follow-up'],
      ['pensando','Pensando ou pesquisando'],
      ['aguard','Aguardando cadastro'],
      ['nao','Não vão seguir'],
      ['creal','Consultas realizadas na semana'],
      ['ccanc','Consultas canceladas na semana'],
      ['creag','Consultas reagendadas na semana'],
      ['cagend','Consultas agendadas na semana']
    ];

    const ORIG = {
      novo:'Novo lead',
      c2:'2º contato (FU 2)',
      c3:'3º contato (FU 3)',
      c4:'4º contato (FU 4)',
      c5:'5º contato (FU 5)',
      sem:'Sem retorno no follow-up'
    };

    const STORAGE = {
      weeks: 'kommo_weeks',
      appts: 'kommo_appts',
      cfg: 'kommo_cfg'
    };

    let db = null;
    let weeks = {};
    let appts = {};
    let cfg = {};
    let currentTab = 'dash';

    const $ = (sel) => document.querySelector(sel);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
    const fd = (iso) => iso ? iso.split('-').reverse().slice(0,2).join('/') : '—';
    const fdf = (iso) => iso ? iso.split('-').reverse().join('/') : '—';
    const today = () => new Date().toISOString().slice(0,10);
    const fmtDateTime = (d) => {
      if (!d) return 'Nunca';
      return new Date(d).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
    };
    const toast = (msg) => {
      const m = $('#msg');
      if (!m) return;
      m.textContent = msg;
      m.style.opacity = '1';
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => m.style.opacity = '0', 1800);
    };

    function loadLocal(key, fallback = {}) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return fallback;
        const parsed = JSON.parse(raw);
        return parsed && typeof parsed === 'object' ? parsed : fallback;
      } catch (error) {
        return fallback;
      }
    }

    function persistLocal(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (error) {
        console.warn('Não foi possível gravar no localStorage:', error);
      }
    }

    function normalizeWeekPayload(payload = {}) {
      const base = {};
      FIELDS.forEach(([key]) => {
        const value = Number(payload[key] ?? 0);
        base[key] = Number.isFinite(value) ? Math.max(0, value) : 0;
      });
      return base;
    }

    function normalizeAppointment(appt = {}) {
      return {
        patient: String(appt.patient || '').trim(),
        origin: appt.origin || 'novo',
        schedOn: appt.schedOn || today(),
        consult: appt.consult || '',
        status: appt.status || 'agendada',
        regained: appt.regained || '',
        newDate: appt.newDate || ''
      };
    }

    function lab(k) {
      return (cfg.labels && cfg.labels[k]) || FIELDS.find(([key]) => key === k)?.[1] || k;
    }

    function syncInfo() {
      const as = cfg.sync || {};
      const last = as.lastSync ? fmtDateTime(as.lastSync) : 'Nunca';
      const status = as.status || 'Sucesso';
      const retry = as.retryAt ? fmtDateTime(as.retryAt) : '—';
      const next = as.nextSync ? fmtDateTime(as.nextSync) : '—';
      return { last, status, retry, next };
    }

    function applyCfg() {
      if (!cfg.title) cfg.title = 'Painel KOMMO';
      const ttl = $('#ttl');
      if (ttl) ttl.textContent = cfg.title;
      document.title = cfg.title;
      buildForm();
      renderCfg();
    }

    async function saveCfg(patch) {
      cfg = { ...cfg, ...patch };
      persistLocal(STORAGE.cfg, cfg);
      applyCfg();
      if (db && typeof db.doc === 'function') {
        try {
          await db.doc('config/main').set(cfg);
        } catch (error) {
          toast('Não foi possível salvar a configuração');
        }
      }
    }

    function renderDashboard() {
      const totalWeeks = Object.keys(weeks).length;
      const totalAppts = Object.keys(appts).length;
      const statusClass = (cfg.sync && cfg.sync.status === 'Erro') ? 'status-error' : 'status-success';
      const statusText = (cfg.sync && cfg.sync.status) || 'Sucesso';
      $('#dash').innerHTML = `
        <h2>Resumo</h2>
        <div class="grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;">
          <div class="card" style="margin:0"><span class="note">Semanas lançadas</span><div style="font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:6px">${totalWeeks}</div></div>
          <div class="card" style="margin:0"><span class="note">Consultas</span><div style="font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:6px">${totalAppts}</div></div>
          <div class="card" style="margin:0"><span class="note">Status</span><div style="font-size:20px;font-weight:700;letter-spacing:-.02em;margin-top:6px" class="${statusClass}">${statusText}</div></div>
        </div>
      `;
    }

    function buildForm() {
      const formFields = FIELDS.filter(([key]) => key !== 'creal' && key !== 'ccanc' && key !== 'creag' && key !== 'cagend');
      $('#wf').innerHTML = formFields.map(([key]) =>
        `<label>${esc(lab(key))}<input type="number" min="0" id="w_${key}" value="0"></label>`
      ).join('');
      $('#cp_o').innerHTML = Object.entries(ORIG).map(([key, label]) => `<option value="${key}">${label}</option>`).join('');
      fillForm(null);
    }

    function fillForm(values) {
      const current = values || {};
      FIELDS.forEach(([key]) => {
        const el = document.getElementById('w_' + key);
        if (el) el.value = Number(current[key] ?? 0);
      });
    }

    function readForm() {
      return normalizeWeekPayload(FIELDS.reduce((out, [key]) => {
        const el = document.getElementById('w_' + key);
        out[key] = el ? (Number(el.value) || 0) : 0;
        return out;
      }, {}));
    }

    function loadWeek() {
      const id = $('#wd').value;
      const data = weeks[id] || {};
      fillForm(data);
    }

    function saveWeek(id, payload) {
      if (!id) return toast('Escolha a data da semana');
      const safePayload = normalizeWeekPayload(payload || {});
      weeks[id] = safePayload;
      persistLocal(STORAGE.weeks, weeks);
      renderWeeks();
      renderDashboard();
      toast('Semana salva');
      if (db && typeof db.doc === 'function') {
        db.doc('weeks/' + id).set(safePayload).catch(() => toast('Erro ao salvar no banco'));
      }
    }

    function deleteWeek(id) {
      if (!id || !weeks[id]) return;
      if (!confirm('Excluir a semana de ' + fdf(id) + '?')) return;
      delete weeks[id];
      persistLocal(STORAGE.weeks, weeks);
      renderWeeks();
      renderDashboard();
      if (db && typeof db.doc === 'function') {
        db.doc('weeks/' + id).delete().catch(() => toast('Erro ao excluir no banco'));
      }
      const current = $('#wd').value;
      if (current === id) {
        $('#wd').value = '';
        fillForm(null);
      }
      toast('Semana excluída');
    }

    function renderWeeks() {
      const keys = Object.keys(weeks).sort().reverse();
      if (!keys.length) {
        $('#wl').innerHTML = '<p class="note">Nenhuma semana lançada.</p>';
        return;
      }
      const rows = keys.map((id) => {
        const item = normalizeWeekPayload(weeks[id] || {});
        const values = FIELDS.filter(([key]) => key !== 'creal' && key !== 'ccanc' && key !== 'creag' && key !== 'cagend')
          .map(([key]) => `<td>${item[key] || 0}</td>`)
          .join('');
        return `
          <tr>
            <td>${fdf(id)}</td>
            ${values}
            <td>
              <button class="b s" data-week-edit="${id}">Editar</button>
              <button class="b s" data-week-save="${id}" style="margin-left:4px">Salvar</button>
              <button class="x" data-week-del="${id}" title="Excluir">✕</button>
            </td>
          </tr>
        `;
      }).join('');

      $('#wl').innerHTML = `
        <table>
          <tr>
            <th>Semana</th>
            ${FIELDS.filter(([key]) => key !== 'creal' && key !== 'ccanc' && key !== 'creag' && key !== 'cagend').map(([key]) => `<th>${esc(lab(key))}</th>`).join('')}
            <th></th>
          </tr>
          ${rows}
        </table>
      `;
    }

    function addAppointment() {
      const patient = $('#cp_n').value.trim();
      if (!patient) return toast('Informe o paciente');
      const id = 'a' + Date.now().toString(36);
      const appointment = normalizeAppointment({
        patient,
        origin: $('#cp_o').value,
        schedOn: $('#cp_s').value || today(),
        consult: $('#cp_c').value,
        status: 'agendada',
        regained: '',
        newDate: ''
      });
      appts[id] = appointment;
      persistLocal(STORAGE.appts, appts);
      renderAppointments();
      renderDashboard();
      $('#cp_n').value = '';
      if (db && typeof db.doc === 'function') {
        db.doc('appts/' + id).set(appointment).catch(() => toast('Erro ao salvar a consulta'));
      }
      toast('Consulta adicionada');
    }

    function renderAppointments() {
      const ids = Object.keys(appts).sort((a, b) => (appts[b].consult || '').localeCompare(appts[a].consult || ''));
      if (!ids.length) {
        $('#al').innerHTML = '<p class="note">Nenhuma consulta registrada ainda.</p>';
        return;
      }
      $('#al').innerHTML = `
        <table>
          <tr>
            <th>Paciente</th>
            <th>Veio de</th>
            <th>Agendada em</th>
            <th>Consulta</th>
            <th>Status</th>
            <th>Reagendar?</th>
            <th>Nova data</th>
            <th></th>
          </tr>
          ${ids.map((id) => {
            const a = normalizeAppointment(appts[id] || {});
            return `
              <tr>
                <td>${esc(a.patient)}</td>
                <td>
                  <select data-id="${id}" data-k="origin">
                    ${Object.entries(ORIG).map(([key, label]) => `<option value="${key}" ${(a.origin || 'novo') === key ? 'selected' : ''}>${label}</option>`).join('')}
                  </select>
                </td>
                <td><input type="date" data-id="${id}" data-k="schedOn" value="${a.schedOn || ''}"></td>
                <td><input type="date" data-id="${id}" data-k="consult" value="${a.consult || ''}"></td>
                <td>
                  <select data-id="${id}" data-k="status">
                    <option value="agendada" ${a.status === 'agendada' ? 'selected' : ''}>Agendada</option>
                    <option value="realizada" ${a.status === 'realizada' ? 'selected' : ''}>Realizada</option>
                    <option value="cancelada" ${a.status === 'cancelada' ? 'selected' : ''}>Cancelada</option>
                    <option value="reagendada" ${a.status === 'reagendada' ? 'selected' : ''}>Reagendada</option>
                  </select>
                </td>
                <td>
                  <select data-id="${id}" data-k="regained">
                    <option value="">—</option>
                    <option value="sim" ${a.regained === 'sim' ? 'selected' : ''}>Sim, reagendado</option>
                    <option value="contato" ${a.regained === 'contato' ? 'selected' : ''}>Em contato</option>
                    <option value="nao" ${a.regained === 'nao' ? 'selected' : ''}>Não conseguiu</option>
                  </select>
                </td>
                <td><input type="date" data-id="${id}" data-k="newDate" value="${a.newDate || ''}"></td>
                <td><button class="x" data-del="${id}" title="Excluir">✕</button></td>
              </tr>
            `;
          }).join('')}
        </table>
      `;
    }

    function renderCfg() {
      const info = syncInfo();
      const labels = Object.entries(FIELDS).map(([i, [key, label]]) => {
        const current = lab(key);
        return `
          <div class="row" style="margin-top:8px">
            <input value="${esc(current)}" data-label="${key}" style="flex:1;min-width:180px">
            <button class="b s" data-field-del="${key}">Excluir</button>
          </div>
        `;
      }).join('');

      $('#cfg').innerHTML = `
        <div class="card">
          <h2>Nome do painel</h2>
          <input id="c_t" value="${esc(cfg.title || 'Painel KOMMO')}" style="width:100%;max-width:420px">
        </div>

        <div class="card">
          <h2>Sincronização com SheetDB</h2>
          <p class="note">Última sincronização: <strong>${info.last}</strong><br>
          Data e hora: <strong>${info.last}</strong><br>
          Status: <span class="tag ${info.status === 'Erro' ? 'status-error' : 'status-success'}">${info.status}</span><br>
          Próxima tentativa: <strong>${info.retry}</strong></p>
          <div class="row">
            <button class="b" id="sheet_retry">Reenviar</button>
            <button class="b s" id="sheet_refresh">Atualizar status</button>
          </div>
          <p class="note">Re-tentativa automática 10 minutos depois do erro.</p>
          <p class="note">Agendamento diário conforme o cron: seg–qui às 17:53 e sex às 16:50.</p>
        </div>

        <div class="card">
          <h2>Nomes dos campos semanais</h2>
          <p class="note">Adicione, edite ou remova campos sem alterar o layout do painel.</p>
          ${labels}
          <div class="row" style="margin-top:12px;align-items:center">
            <input id="new_field" placeholder="Novo campo" style="flex:1;min-width:180px">
            <button class="b" id="add_field">Adicionar</button>
          </div>
        </div>
      `;
    }

    async function init() {
      const savedWeeks = loadLocal(STORAGE.weeks, {});
      const savedAppts = loadLocal(STORAGE.appts, {});
      const savedCfg = loadLocal(STORAGE.cfg, {});
      weeks = savedWeeks || {};
      appts = savedAppts || {};
      cfg = savedCfg || {};

      try {
        db = await window.claude.use('db');
      } catch (error) {
        db = null;
      }

      if (!db) {
        $('#st').textContent = 'Modo temporário: os dados ficam salvos no navegador.';
      } else {
        $('#st').textContent = 'Sincronizado em tempo real';
      }

      renderDashboard();
      renderWeeks();
      renderAppointments();
      renderCfg();
      buildForm();
      $('#wd').value = today();
      $('#cp_s').value = today();
      $('#cp_o').innerHTML = Object.entries(ORIG).map(([key, label]) => `<option value="${key}">${label}</option>`).join('');
      fillForm({});
    }

    function updateInputLabel(key, value) {
      const labels = { ...(cfg.labels || {}) };
      const trimmed = value.trim();
      if (!trimmed) delete labels[key];
      else labels[key] = trimmed;
      cfg.labels = labels;
      persistLocal(STORAGE.cfg, cfg);
      buildForm();
      renderWeeks();
      renderDashboard();
    }

    function addCustomField() {
      const field = $('#new_field').value.trim();
      if (!field) return toast('Digite um nome para o novo campo');
      const key = 'custom_' + Date.now().toString(36);
      const labels = { ...(cfg.labels || {}) };
      labels[key] = field;
      cfg.labels = labels;
      persistLocal(STORAGE.cfg, cfg);
      renderCfg();
      toast('Campo adicionado');
    }

    $('#nav').onclick = (e) => {
      const tab = e.target.dataset.t;
      if (!tab) return;
      currentTab = tab;
      ['dash', 'sem', 'cons', 'cfg'].forEach(id => {
        document.getElementById(id).classList.toggle('hide', id !== tab);
      });
      document.querySelectorAll('#nav button').forEach(btn => btn.classList.toggle('on', btn.dataset.t === tab));
    };

    $('#wd').onchange = loadWeek;
    $('#cp').onclick = () => {
      const currentId = $('#wd').value;
      const ids = Object.keys(weeks).sort();
      const previous = ids.filter(v => v < currentId).pop();
      if (!previous) return toast('Não há semana anterior');
      fillForm(weeks[previous]);
      toast('Valores copiados da semana anterior');
    };
    $('#ws').onclick = () => saveWeek($('#wd').value, readForm());
    $('#wdel').onclick = () => deleteWeek($('#wd').value);

    $('#wl').onclick = (e) => {
      const editId = e.target.dataset.weekEdit;
      const saveId = e.target.dataset.weekSave;
      const delId = e.target.dataset.weekDel;
      if (editId) {
        $('#wd').value = editId;
        loadWeek();
        toast('Semana pronta para editar');
      }
      if (saveId) {
        const activeId = $('#wd').value;
        const payload = (activeId === saveId) ? readForm() : normalizeWeekPayload(weeks[saveId] || {});
        saveWeek(saveId, payload);
      }
      if (delId) {
        deleteWeek(delId);
      }
    };

    $('#cp_add').onclick = addAppointment;
    $('#al').onchange = (e) => {
      const id = e.target.dataset.id;
      const key = e.target.dataset.k;
      if (!id || !key) return;
      const row = normalizeAppointment(appts[id] || {});
      row[key] = e.target.value;
      if (key === 'status' && row.status === 'reagendada' && !row.regained) row.regained = 'sim';
      if (key === 'status' && (row.status === 'agendada' || row.status === 'realizada')) {
        row.regained = '';
        row.newDate = '';
      }
      appts[id] = row;
      persistLocal(STORAGE.appts, appts);
      renderAppointments();
      renderDashboard();
      if (db && typeof db.doc === 'function') db.doc('appts/' + id).set(row).catch(() => toast('Erro ao salvar consulta'));
    };
    $('#al').onclick = (e) => {
      const id = e.target.dataset.del;
      if (!id) return;
      if (!confirm('Excluir esta consulta?')) return;
      delete appts[id];
      persistLocal(STORAGE.appts, appts);
      renderAppointments();
      renderDashboard();
      if (db && typeof db.doc === 'function') db.doc('appts/' + id).delete().catch(() => toast('Erro ao excluir consulta'));
    };

    $('#cfg').onchange = (e) => {
      const t = e.target;
      if (t.id === 'c_t') {
        return saveCfg({ title: t.value.trim() || 'Painel KOMMO' });
      }
      if (t.dataset.label) {
        updateInputLabel(t.dataset.label, t.value);
      }
    };
    $('#cfg').onclick = async (e) => {
      const id = e.target.id;
      const fieldDel = e.target.dataset.fieldDel;
      if (fieldDel) {
        const labels = { ...(cfg.labels || {}) };
        delete labels[fieldDel];
        cfg.labels = labels;
        persistLocal(STORAGE.cfg, cfg);
        renderCfg();
        return;
      }
      if (id === 'add_field') {
        addCustomField();
        return;
      }
      if (id === 'sheet_retry') {
        const now = new Date().toISOString();
        cfg.sync = { ...(cfg.sync || {}), lastSync: now, status: 'Sucesso', retryAt: new Date(Date.now() + 10 * 60000).toISOString() };
        persistLocal(STORAGE.cfg, cfg);
        renderCfg();
        toast('Reenvio realizado');
        return;
      }
      if (id === 'sheet_refresh') {
        const sync = syncInfo();
        toast('Última sincronização: ' + sync.last + ' · ' + sync.status);
      }
    };

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
